<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Omnia Now</title>
<style>
:root{--bg:#07060f;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#f5f3ff;--mute:#9a94b8;--a:#8b5cf6;--b:#22d3ee;--p:#f472b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.aurora{position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 15%,rgba(139,92,246,.45),transparent),radial-gradient(35% 30% at 85% 25%,rgba(34,211,238,.28),transparent),radial-gradient(40% 35% at 60% 95%,rgba(244,114,182,.25),transparent);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}
.hide{display:none!important}
.grad{background:linear-gradient(90deg,var(--a),var(--b),var(--p));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200%}}
.logo{font-weight:800;letter-spacing:1px;font-size:20px}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:99;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
.orb{width:110px;height:110px;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--b),var(--p),var(--a));display:grid;place-items:center;font-size:48px;animation:spin 3s linear infinite,pop .9s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 60px rgba(139,92,246,.7)}
.orb i{font-style:normal;animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0)}}
#splash h2{margin:0;font-size:34px;animation:up .8s .3s both}
#splash p{margin:0;color:var(--mute);animation:up .8s .6s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
#setup{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 48px) 24px 40px;max-width:480px;margin:auto}
#setup>div{animation:up .5s both}
h1{font-size:32px;margin:22px 0 6px}.sub{color:var(--mute);margin:0 0 18px}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:14px;font-size:16px;margin-top:10px;font-family:inherit;outline:none;transition:.25s}
input:focus,textarea:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
select option{color:#000}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;color:#fff;margin-top:12px;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer;box-shadow:0 8px 30px rgba(139,92,246,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.g{background:var(--card);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.45}
.err{color:#fb7185;margin-top:14px;font-size:14px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
label.ck{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--mute)}
label.ck input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--a)}
.done{width:120px;height:120px;border-radius:50%;margin:40px auto 10px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,var(--a),var(--b));animation:pop .7s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 70px rgba(34,211,238,.5)}
#app{display:flex;flex-direction:column;height:100dvh;animation:up .6s both}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;text-decoration:none;font-weight:600;font-size:14px;margin-left:4px;transition:.2s;backdrop-filter:blur(10px)}
.pill:active{transform:scale(.92)}
.chips{display:flex;gap:8px;padding:4px 14px 8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;transition:.25s}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 4px 18px rgba(139,92,246,.45)}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;padding:0 14px 10px;overflow-y:auto}
.pane.on{display:flex;animation:up .35s both}
nav{display:flex;margin:0 12px calc(env(safe-area-inset-bottom) + 10px);padding:8px;border-radius:24px;background:rgba(20,16,40,.8);border:1px solid var(--line);backdrop-filter:blur(18px)}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:16px;transition:.25s}
nav button span{font-size:22px;transition:.25s;filter:grayscale(1);opacity:.6}
nav button.on{color:#fff;background:rgba(139,92,246,.25)}nav button.on span{filter:none;opacity:1;transform:translateY(-2px) scale(1.15)}
.msgs{flex:1;overflow-y:auto;padding:4px 0}
.b{max-width:86%;padding:12px 14px;border-radius:18px;margin:0 0 10px;border:1px solid var(--line);white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;animation:bub .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes bub{from{opacity:0;transform:translateY(12px) scale(.92)}}
.b.me{margin-left:auto;background:linear-gradient(135deg,rgba(139,92,246,.5),rgba(34,211,238,.3));border-radius:18px 18px 4px 18px}
.b.ai{background:var(--card);border-radius:18px 18px 18px 4px}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--b);animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-7px);opacity:.4}}
.bar{display:flex;gap:10px;align-items:center;padding-top:8px}.bar input{margin:0}
.send{width:48px;height:48px;border-radius:50%;border:0;color:#fff;font-size:18px;flex:none;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 22px rgba(139,92,246,.5);transition:.2s}
.send:active{transform:scale(.85) rotate(-20deg)}
.stage{margin-top:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden;position:relative}
.shim{aspect-ratio:1;display:grid;place-items:center;text-align:center;color:var(--mute);background:linear-gradient(110deg,transparent 30%,rgba(139,92,246,.25) 50%,transparent 70%) var(--card);background-size:250% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.shim big{display:block;font-size:54px;animation:float 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) scale(1.1)}}
.stage img,.stage video{width:100%;display:block;animation:reveal .8s both}
@keyframes reveal{from{opacity:0;transform:scale(1.08);filter:blur(14px)}}
.prog{height:6px;background:var(--line);border-radius:6px;margin:14px 16px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s}
.term{margin-top:14px;border-radius:16px;background:#0b0818;border:1px solid var(--line);padding:14px;font:13px/1.7 ui-monospace,monospace;color:#7ee787;min-height:96px}
.term b{color:var(--b)}.term u{text-decoration:none;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
iframe{width:100%;flex:1;min-height:360px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:14px;animation:reveal .7s both}
.row{display:flex;gap:8px}.row .btn{margin-top:10px;padding:11px;font-size:14px}
.note{color:var(--mute);font-size:14px;margin-top:10px}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-end;animation:fade .25s}
@keyframes fade{from{opacity:0}}
#sheet>div{width:100%;max-height:82dvh;overflow-y:auto;background:#120e26;border-radius:26px 26px 0 0;border:1px solid var(--line);padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);animation:slide .4s cubic-bezier(.2,1,.3,1)}
@keyframes slide{from{transform:translateY(100%)}}
#sheet h3{margin:0 0 12px;font-size:20px}
.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px;margin-top:10px}
.card small{color:var(--mute);display:block;margin-top:3px}
.hi{cursor:pointer}.hi:active{transform:scale(.98)}
</style></head><body>
<div class="aurora"></div>
<div id="splash"><div class="orb"><i>&#10024;</i></div><h2 class="grad">Omnia Now</h2><p>Omnyx AI &#128142; loading...</p></div>
<div id="setup" class="hide"></div>
<div id="app" class="hide">
  <div class="top"><div class="logo grad">&#127756; omnia now</div>
    <div><button class="pill" id="hb">&#128344;</button><button class="pill" id="pb">&#128081;</button><a class="pill" href="https://discord.gg/nfuCjtThz" target="_blank" rel="noopener">&#128172; Discord</a></div></div>
  <div class="chips" id="chips"></div>
  <main>
    <section class="pane on" id="p-chat"><div class="msgs" id="msgs"></div>
      <div class="bar"><input id="ci" placeholder="Ask Omnyx anything..."><button class="send" id="cs">&#10148;</button></div></section>
    <section class="pane" id="p-code"><textarea id="ti" rows="3" placeholder="&#128187; What website/app should I build? e.g. premium todo app"></textarea>
      <button class="btn" id="tb">&#128640; Generate</button><div id="tm"></div><iframe id="fr" class="hide" sandbox="allow-scripts"></iframe>
      <div class="row hide" id="tr"><button class="btn g" id="tc">&#128203; Copy code</button><button class="btn g" id="to">&#128279; Full screen</button></div></section>
    <section class="pane" id="p-image"><textarea id="ii" rows="3" placeholder="&#127912; Describe your image..."></textarea>
      <button class="btn" id="ib">&#127912; Generate image</button><div class="stage hide" id="is"></div><a class="btn g hide" id="idl" download="omnia.png">&#11015;&#65039; Save image</a></section>
    <section class="pane" id="p-video"><textarea id="vi" rows="3" placeholder="&#127916; Describe your video..."></textarea>
      <button class="btn" id="vb">&#127916; Generate video</button><div class="stage hide" id="vs"></div></section>
  </main>
  <nav><button data-t="chat" class="on"><span>&#128172;</span>Chat</button><button data-t="code"><span>&#128187;</span>Code</button><button data-t="image"><span>&#127912;</span>Image</button><button data-t="video"><span>&#127916;</span>Video</button></nav>
</div>
<div id="sheet" class="hide"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=()=>localStorage.getItem('omnia_t');
async function api(p,b){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','x-token':T()||''},body:JSON.stringify(b||{})});const d=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw new Error(d.error||'Error');return d}
let P=null,cur='lite',tab='chat',H={chats:[],images:[],codes:[],videos:[]},chat=null,lastHtml='';
const hk=()=>'omnia_h_'+P.user.email,saveH=()=>{try{localStorage.setItem(hk(),JSON.stringify(H))}catch{ // storage full: drop big image data
 H.images=H.images.slice(0,6);try{localStorage.setItem(hk(),JSON.stringify(H))}catch{}}};
const has=m=>m==='lite'||(P.user.subs[m]||0)>Date.now();
const left=t=>{const d=t-Date.now();return d>864e5?Math.ceil(d/864e5)+' days':Math.max(1,Math.ceil(d/36e5))+' hours'};
const LB=()=>P.labels;

// ---------- setup ----------
const S={mode:'signup',first:'',last:'',email:'',pw:'',promo:'',pm:'x1',loc:true,err:''};
function view(step){
 $('splash').classList.add('out');$('app').classList.add('hide');const el=$('setup');el.classList.remove('hide');
 const head=(t,s)=>`<div class="logo grad">&#127756; omnia now</div><h1>${t}</h1><p class="sub">${s}</p>`,err=S.err?`<div class="err">${esc(S.err)}</div>`:'';
 let h='';
 if(step==='choose')h=head('Welcome &#128142;','One quick setup, then everything with Omnyx AI.')+`<button class="btn" data-a="su">&#10024; Sign up</button><button class="btn g" data-a="si">&#128273; Sign in</button>`;
 if(step==='form'){const su=S.mode==='signup';h=head(su?'Create account':'Welcome back &#128075;',su?'No email code needed. Just enter your details.':'Enter your email and password.')+
  (su?`<input id="f" placeholder="First name" value="${esc(S.first)}"><input id="l" placeholder="Last name" value="${esc(S.last)}">`:'')+
  `<input id="e" type="email" placeholder="Email" value="${esc(S.email)}"><input id="pw" type="password" placeholder="Password (6+ characters)" value="${esc(S.pw)}">`+
  (su?`<input id="pc" placeholder="&#127873; Promo code (optional)" value="${esc(S.promo)}"><select id="pm" class="${S.promo?'':'hide'}"><option value="x1">Ultimate X1 (3 days free)</option><option value="x2">Ultimate X2 (3 days free)</option></select>
  <label class="ck"><input type="checkbox" id="lc" ${S.loc?'checked':''}><span>&#128205; Share live location (optional). Only the admin can see it, and you can turn it off anytime.</span></label>`:'')+
  `<button class="btn" data-a="go">Continue</button><button class="btn g" data-a="bk">Back</button>${err}`}
 if(step==='terms')h=head('Almost done &#127881;','Please accept the Terms and Conditions.')+`<label class="ck"><input type="checkbox" id="t"><span>I agree to the Terms and Conditions and Privacy Policy.</span></label><button class="btn" id="fin" data-a="fin" disabled>All done</button>${err}`;
 if(step==='done')h=`<div class="done">&#127881;</div><h1 style="text-align:center">All done!</h1><p class="sub" style="text-align:center">Omnyx is ready &#128142;</p>`;
 el.innerHTML='<div>'+h+'</div>';
 const g=id=>$(id)?.value?.trim()||'';
 if($('pc'))$('pc').oninput=()=>$('pm').classList.toggle('hide',!$('pc').value.trim());
 if($('t'))$('t').onchange=()=>$('fin').disabled=!$('t').checked;
 el.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
  if(a==='su'||a==='si'){S.mode=a==='su'?'signup':'signin';S.err='';view('form')}
  if(a==='bk')view(step==='form'?'choose':'form');
  if(a==='go'){S.email=g('e').toLowerCase();S.pw=$('pw').value;if(S.mode==='signup'){S.first=g('f');S.last=g('l');S.promo=g('pc');S.pm=$('pm').value;S.loc=$('lc').checked}
   S.err='';if(!/^\S+@\S+\.\S+$/.test(S.email))S.err='Enter a valid email';else if(S.pw.length<6)S.err='Password must be 6+ characters';else if(S.mode==='signup'&&(!S.first||!S.last))S.err='Enter first and last name';
   if(S.err)return view('form');
   if(S.mode==='signup')view('terms');else submit('login')}
  if(a==='fin')submit('register')})}
async function submit(action){
 try{const d=await api('auth',{action,first:S.first,last:S.last,email:S.email,password:S.pw,promo:S.promo,promoModel:S.pm,locConsent:S.loc});
  localStorage.setItem('omnia_t',d.token);if(action==='register'){view('done');await new Promise(r=>setTimeout(r,1600))}await start()}
 catch(e){S.err=e.message;view(action==='register'?'terms':'form')}}

// ---------- app ----------
async function start(){
 try{P=await api('me',{})}catch(e){localStorage.removeItem('omnia_t');return view('choose')}
 try{H=Object.assign({chats:[],images:[],codes:[],videos:[]},JSON.parse(localStorage.getItem(hk())))}catch{}
 $('splash').classList.add('out');$('setup').classList.add('hide');$('app').classList.remove('hide');
 renderChips();newChat();trackLoc();}
function renderChips(){const c=$('chips');c.innerHTML=Object.keys(LB()).map(k=>`<button class="chip ${k===cur?'on':''}" data-m="${k}">${k==='lite'?'&#9889;':k==='x1'?'&#128142;':'&#128081;'} ${esc(LB()[k])}${has(k)?'':' &#128274;'}</button>`).join('');
 c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(!has(b.dataset.m))return plan();cur=b.dataset.m;renderChips()})}
function newChat(){chat={id:Date.now(),title:'New chat',model:cur,msgs:[]};$('msgs').innerHTML='';bub('Hi '+esc(P.user.first)+'! I am Omnyx &#10024; Ask me anything.','ai',true)}
function bub(t,who,html){const d=document.createElement('div');d.className='b '+who;html?d.innerHTML=t:d.textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
async function type(el,t){el.textContent='';for(let i=0;i<t.length;i+=3){el.textContent=t.slice(0,i+3);$('msgs').scrollTop=1e9;await new Promise(r=>setTimeout(r,12))}}
async function send(){const t=$('ci').value.trim();if(!t)return;$('ci').value='';bub(t,'me');chat.msgs.push({role:'user',content:t});if(chat.msgs.length===1)chat.title=t.slice(0,40);
 const w=bub('<span class="dots"><span></span><span></span><span></span></span>','ai',true);
 try{const d=await api('chat',{model:cur,messages:chat.msgs});await type(w,d.text);chat.msgs.push({role:'assistant',content:d.text});
  H.chats=[chat,...H.chats.filter(c=>c.id!==chat.id)].slice(0,40);saveH()}
 catch(e){w.textContent='⚠️ '+e.message;chat.msgs.pop()}}
async function job(b,fn){b.disabled=true;try{await fn()}catch(e){alert('⚠️ '+e.message)}b.disabled=false}
function ticker(el,msgs,ms){let i=0;const f=()=>{el(msgs[Math.min(i++,msgs.length-1)],i)};f();return setInterval(f,ms)}

$('cs').onclick=send;$('ci').onkeydown=e=>e.key==='Enter'&&send();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('p-'+tab).classList.add('on');$('chips').classList.toggle('hide',!['chat','code'].includes(tab))});

$('tb').onclick=()=>job($('tb'),async()=>{const p=$('ti').value.trim();if(!p)return;$('fr').classList.add('hide');$('tr').classList.add('hide');
 const L=['Understanding your prompt','Designing the UI','Writing HTML + CSS','Adding animations','Final polish'];
 const iv=ticker((m,i)=>$('tm').innerHTML=`<div class="term">${L.slice(0,i).map((x,j)=>`<div>&gt; ${j<i-1?'<b>&#10003;</b>':'&#9889;'} ${x}</div>`).join('')}<u>_</u></div>`,1800,L);
 try{const d=await api('code',{model:cur,prompt:p});lastHtml=d.html;$('fr').srcdoc=d.html;$('fr').classList.remove('hide');$('tr').classList.remove('hide');H.codes.unshift({id:Date.now(),prompt:p,html:d.html});H.codes=H.codes.slice(0,15);saveH()}finally{clearInterval(iv);$('tm').innerHTML=''}});
$('tc').onclick=()=>{navigator.clipboard?.writeText(lastHtml);$('tc').textContent='✅ Copied'};
$('to').onclick=()=>{const w=open('');w.document.write(lastHtml);w.document.close()};

function showImg(src){const s=$('is');s.classList.remove('hide');s.innerHTML='';const im=new Image();im.onload=()=>{s.innerHTML='';s.appendChild(im);$('idl').href=src;$('idl').classList.remove('hide')};im.onerror=()=>{s.innerHTML='<div class="shim">Image failed to load</div>'};im.src=src}
$('ib').onclick=()=>job($('ib'),async()=>{const p=$('ii').value.trim();if(!p)return;$('idl').classList.add('hide');const s=$('is');s.classList.remove('hide');
 s.innerHTML='<div class="shim"><div><big>&#127912;</big><div id="im">Starting imagination...</div></div></div>';
 const iv=ticker(m=>{const e=$('im');if(e)e.textContent=m},1500,['Mixing colors &#127752;','Creating pixels &#10024;','Adding detail &#128142;','Almost ready...'].map(x=>x.replace(/&#\d+;/g,'')));
 try{const d=await api('image',{prompt:p});showImg(d.image);H.images.unshift({id:Date.now(),prompt:p,src:d.image});H.images=H.images.slice(0,12);saveH()}catch(e){s.classList.add('hide');throw e}finally{clearInterval(iv)}});
$('vb').onclick=()=>job($('vb'),async()=>{const p=$('vi').value.trim();if(!p)return;const s=$('vs');s.classList.remove('hide');
 s.innerHTML='<div class="shim"><div><big>&#127916;</big><div id="vm">Setting the scene...</div></div></div><div class="prog"><i id="vp"></i></div>';
 let pct=5;const iv=ticker(m=>{const e=$('vm');if(e)e.textContent=m;pct=Math.min(92,pct+11);const b=$('vp');if(b)b.style.width=pct+'%'},4500,['Setting up the camera','Rendering frames','Adding motion','Free AI is slow, please wait','Almost ready'].map(x=>x));
 try{const d=await api('video',{prompt:p});s.innerHTML='';const v=document.createElement('video');v.src=d.video;v.controls=v.loop=v.autoplay=v.playsInline=true;s.appendChild(v);H.videos.unshift({id:Date.now(),prompt:p});H.videos=H.videos.slice(0,20);saveH()}catch(e){s.classList.add('hide');throw e}finally{clearInterval(iv)}});

// ---------- sheets ----------
function sheet(html){const s=$('sheet');s.innerHTML='<div>'+html+'</div>';s.classList.remove('hide');s.onclick=e=>{if(e.target===s)s.classList.add('hide')};return s}
function plan(){const u=P.user;let h='<h3>&#128081; Plans &amp; Settings</h3>';
 h+=['x1','x2'].map(k=>`<div class="card"><b>${k==='x1'?'&#128142;':'&#128081;'} ${esc(LB()[k])}</b> ${has(k)?'<span style="color:#4ade80">&#9679; Active</span>':'&#128274;'}<small>${has(k)?left(u.subs[k])+' left':'Not subscribed'}</small></div>`).join('');
 h+=`<div class="card"><b>&#127873; Promo code</b><small>Any one model free for ${P.promoDays} days</small><input id="spc" placeholder="Promo code"><select id="spm"><option value="x1">${esc(LB().x1)}</option><option value="x2">${esc(LB().x2)}</option></select><button class="btn" id="spb">Apply</button></div>`;
 h+=`<a class="btn g" style="text-decoration:none;text-align:center" href="https://discord.gg/nfuCjtThz" target="_blank">&#128142; Get a subscription on Discord</a>`;
 h+=`<div class="card"><label class="ck" style="margin:0"><input type="checkbox" id="slc" ${u.locConsent?'checked':''}><span>&#128205; Share live location (only admin can see it)</span></label></div><button class="btn g" id="lo">Logout</button>`;
 const s=sheet(h);
 $('spb').onclick=async()=>{try{P=await api('me',{action:'promo',code:$('spc').value,model:$('spm').value});renderChips();plan()}catch(e){alert('⚠️ '+e.message)}};
 $('slc').onchange=async()=>{P=await api('me',{action:'consent',on:$('slc').checked});trackLoc()};
 $('lo').onclick=()=>{localStorage.removeItem('omnia_t');location.reload()}}
function hist(){const L=tab==='chat'?H.chats:tab==='code'?H.codes:tab==='image'?H.images:H.videos;
 const h=`<h3>&#128344; ${tab==='chat'?'Chat':tab==='code'?'Code':tab==='image'?'Image':'Video'} history</h3>`+(L.length?L.map((x,i)=>`<div class="card hi" data-i="${i}"><b>${esc(x.title||x.prompt)}</b><small>${new Date(x.id).toLocaleString()}</small></div>`).join(''):'<p class="sub">Nothing here yet.</p>')+(tab==='chat'?'<button class="btn" id="nc">&#10024; New chat</button>':'');
 const s=sheet(h);if($('nc'))$('nc').onclick=()=>{newChat();s.classList.add('hide')};
 s.querySelectorAll('.hi').forEach(c=>c.onclick=()=>{const x=L[c.dataset.i];s.classList.add('hide');
  if(tab==='chat'){chat=x;$('msgs').innerHTML='';x.msgs.forEach(m=>bub(m.content,m.role==='user'?'me':'ai'))}
  if(tab==='code'){lastHtml=x.html;$('fr').srcdoc=x.html;$('fr').classList.remove('hide');$('tr').classList.remove('hide');$('ti').value=x.prompt}
  if(tab==='image'){$('ii').value=x.prompt;showImg(x.src)}
  if(tab==='video')$('vi').value=x.prompt})}
$('pb').onclick=plan;$('hb').onclick=hist;

// ---------- live location (consent based) ----------
let wid=null,lastSend=0;
function trackLoc(){if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null}
 if(!P.user.locConsent||!navigator.geolocation)return;
 wid=navigator.geolocation.watchPosition(p=>{if(Date.now()-lastSend<45000)return;lastSend=Date.now();api('me',{action:'loc',lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}).catch(()=>{})},()=>{},{enableHighAccuracy:true,maximumAge:30000})}

setTimeout(()=>T()?start():view('choose'),1900);
</script></body></html>
