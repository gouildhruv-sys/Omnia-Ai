<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0918"><title>Omnia Admin</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#0a0918;--s1:#13112b;--s2:#1b1838;--line:#2b2756;--tx:#f3f1ff;--mu:#9d99c9;--ac:#ff6b9d;--ac2:#6c7bff;--ok:#35d49d;--bad:#ff5d6c;--warn:#ffc15e;--g:linear-gradient(135deg,#ff7a59,#e83fc7 55%,#6c7bff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,#2a1d5c55,transparent),radial-gradient(700px 400px at -10% 10%,#5a1d4a33,transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#0a0918e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--g);display:grid;place-items:center;font-weight:800;box-shadow:0 6px 20px #e83fc755}
header h1{font-size:17px;margin:0;line-height:1.1;white-space:nowrap}header small{display:block;color:var(--mu);font-size:12px;white-space:nowrap}header>div:nth-child(2){min-width:0}header .sp{flex:1}
.live{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:#10301f;border:1px solid #1e5a3b;color:#7ff0bf;padding:6px 11px;border-radius:99px;font-size:13px;font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #35d49d99;animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 8px #35d49d00}100%{box-shadow:0 0 0 0 #35d49d00}}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:linear-gradient(180deg,var(--s1),#110f27);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #00000033}
.card h3{margin:0 0 4px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}@media(min-width:720px){.cards{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;inset:auto -20px -30px auto;width:90px;height:90px;border-radius:50%;background:var(--g);opacity:.12}
.stat .big{font-size:30px;font-weight:800;letter-spacing:-.5px}.stat .mu{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.btn{background:var(--g);border:0;color:#fff;font-weight:700;padding:11px 18px;border-radius:13px;box-shadow:0 8px 22px #e83fc733}
.btn.g{background:var(--s2);border:1px solid var(--line);box-shadow:none}.btn.r{background:#341521;border:1px solid #6b2433;color:#ffa0ab;box-shadow:none}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.5}
input,select,textarea{background:#0e0c22;border:1px solid var(--line);border-radius:13px;padding:12px 13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac2);box-shadow:0 0 0 3px #6c7bff33}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .m{flex:1;min-width:0}.row b,.row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small.w{white-space:normal}
.av{width:40px;height:40px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:800;flex:none}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#272250;color:#cfcbff;margin-right:4px;font-weight:600}
.tag.bad{background:#3a1520;color:#ffa0ab}.tag.ok{background:#11382b;color:#79efc0}.tag.warn{background:#3b2f10;color:#ffd47f}
.fb{display:flex;gap:8px;margin-bottom:12px}.fb>*{flex:1}.fb .btn{flex:0 0 auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:8px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;background:var(--g);border-radius:8px 8px 3px 3px;min-height:4px;margin-bottom:5px}
.meter{height:9px;border-radius:99px;background:#0e0c22;overflow:hidden;flex:0 0 42%}.meter div{height:100%;border-radius:99px;background:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#0d0b20f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:14px;min-width:62px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:var(--s2)}nav button.on svg{stroke:url(#gr)}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet.on{display:flex}
.sheet>div{background:var(--s1);border:1px solid var(--line);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span:first-child{color:var(--mu)}
.thread{display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.45}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,#ff7a59cc,#6c7bffcc);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--s2);border:1px solid var(--line);border-bottom-left-radius:5px}
.meta{font-size:11.5px;color:var(--mu);margin:8px 2px 2px}.meta.r{text-align:right}
#login{max-width:400px;margin:16vh auto 0;padding:0 16px}.err{color:var(--bad);margin-top:8px;min-height:20px;font-size:14px}
.adprev{display:flex;gap:11px;align-items:center;padding:12px;border-radius:16px;background:var(--s2);border:1px solid var(--line);position:relative}
.adprev .at{flex:1;min-width:0}.adprev b{display:block}.adprev p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.adprev .lab{position:absolute;top:6px;right:10px;font-size:10px;letter-spacing:.6px;color:var(--mu);border:1px solid var(--line);padding:0 6px;border-radius:6px}
.adprev img{width:48px;height:48px;border-radius:12px;object-fit:cover}.adprev .go{background:var(--g);border:0;color:#fff;font-weight:700;border-radius:10px;padding:8px 12px;font-size:13px}
.sw{display:flex;align-items:center;gap:10px;margin-top:12px}.sw input{width:auto}
.empty{text-align:center;padding:28px 10px;color:var(--mu)}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0 0;text-transform:none;letter-spacing:0;font-size:15px;color:var(--tx)}.chk input{width:auto}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#6c7bff"/></linearGradient></defs></svg>
<div id="login"><div class="card"><div class="logo" style="margin-bottom:12px">O</div><h3>Omnia Admin</h3><p class="mu">Enter your admin password (the ADMIN_PASSWORD you set in Vercel).</p><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><div class="err" id="lerr"></div><button class="btn" id="lgo" style="width:100%;margin-top:4px">Open dashboard</button></div></div>
<div id="app" hidden>
<header><div class="logo">O</div><div><h1>Omnia Admin</h1><small id="sub">Control room</small></div><span class="sp"></span><span class="live" id="live"><i></i><span>0 online</span></span><button class="btn g sm" id="ref" aria-label="Refresh">&#8635;</button></header>
<div class="wrap" id="view"></div>
<nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div id="sbody"></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)}, KEY="", TAB="overview", C={}, timer=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function api(a,x){
  var r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json","x-admin-key":KEY},body:JSON.stringify(Object.assign({action:a},x||{}))});
  var d=await r.json().catch(function(){return {}});
  if(r.status===401&&a!=="ping") logout();
  if(!r.ok) throw new Error(d.error||("Error "+r.status));
  return d;
}
function ago(t){ if(!t) return "never"; var s=Math.floor((Date.now()-t)/1000); if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago"; return Math.floor(s/86400)+" d ago"; }
function dt(t){ return t?new Date(t).toLocaleString():"-"; }
function ini(n){ return esc((String(n||"?").trim()[0]||"?").toUpperCase()); }
function place(o){ return [o.city,o.country].filter(Boolean).join(", "); }
function closeSheet(){ $("sheet").classList.remove("on"); }
function openSheet(h){ $("sbody").innerHTML=h; $("sheet").classList.add("on"); }
$("sheet").onclick=function(e){ if(e.target===$("sheet")) closeSheet(); };
async function login(){
  KEY=$("pw").value; $("lerr").textContent="";
  try{ await api("ping"); try{ sessionStorage.setItem("omnia-adm",KEY); }catch(e){} $("login").hidden=true; $("app").hidden=false; mkNav(); show("overview"); }
  catch(e){ $("lerr").textContent=e.message; }
}
function logout(){ KEY=""; try{ sessionStorage.removeItem("omnia-adm"); }catch(e){} clearInterval(timer); closeSheet(); $("app").hidden=true; $("login").hidden=false; }
var ICON={overview:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18.5 14.8c1.8.7 2.8 2.3 3 4.7"/>',chats:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',ads:'<path d="M3 11v3l12 4V7z"/><path d="M15 9.5c2 .3 3.5 1.2 4 2.5-.5 1.3-2 2.2-4 2.5M6 15l1.5 4.5"/>',more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'};
function mkNav(){
  var t=[["overview","Overview"],["users","Users"],["chats","Chats"],["ads","Ads"],["more","More"]];
  $("nav").innerHTML=t.map(function(x){return '<button data-t="'+x[0]+'"><svg viewBox="0 0 24 24">'+ICON[x[0]]+'</svg>'+x[1]+'</button>'}).join("");
  [].forEach.call($("nav").children,function(b){ b.onclick=function(){ if(b.dataset.t==="more") moreSheet(); else show(b.dataset.t); }; });
}
function moreSheet(){
  openSheet('<h3 style="margin:0 0 8px">More</h3><div style="display:grid;gap:8px"><button class="btn g" data-g="premium">Premium and invites</button><button class="btn g" data-g="controls">Limits and switches</button><button class="btn g" data-g="insights">Insights</button><button class="btn g" data-g="chatsearch">Search all chats</button><button class="btn g" data-g="health">Health check</button><button class="btn g" data-g="activity">Live activity</button><button class="btn g" data-g="guests">Guests</button><button class="btn g" data-g="blocked">Blocked list</button><button class="btn g" data-g="settings">Settings and status</button><button class="btn r" id="lo">Log out</button></div>');
  [].forEach.call($("sbody").querySelectorAll("[data-g]"),function(b){ b.onclick=function(){ closeSheet(); show(b.dataset.g); }; });
  $("lo").onclick=logout;
}
async function show(t){
  TAB=t; clearInterval(timer);
  [].forEach.call($("nav").children,function(b){ b.className=(b.dataset.t===t||(b.dataset.t==="more"&&["activity","guests","settings","premium","controls","insights","chatsearch","health","blocked"].indexOf(t)>-1))?"on":""; });
  $("view").innerHTML='<div class="card mu">Loading...</div>';
  try{ await V[t](); }catch(e){ $("view").innerHTML='<div class="card"><b>Could not load</b><p class="mu">'+esc(e.message)+'</p></div>'; }
  window.scrollTo(0,0);
}
function chart(s){
  var vals=s.map(function(x){return Number(x.stats.total||0)}), max=Math.max.apply(null,vals.concat([1])), W=300, H=110, n=vals.length;
  var pts=vals.map(function(v,i){return [n>1?i*(W/(n-1)):W/2, H-8-(v/max)*(H-24)]});
  var line=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" ");
  var area=line+" L"+W+" "+H+" L0 "+H+" Z";
  return '<svg viewBox="0 0 '+W+' '+(H+18)+'" style="width:100%;height:auto;display:block"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e83fc7" stop-opacity=".45"/><stop offset="1" stop-color="#6c7bff" stop-opacity="0"/></linearGradient><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#6c7bff"/></linearGradient></defs><path d="'+area+'" fill="url(#ar)"/><path d="'+line+'" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#fff"/><text x="'+p[0]+'" y="'+(H+14)+'" font-size="9" fill="#9d99c9" text-anchor="'+(i===0?"start":i===n-1?"end":"middle")+'">'+esc(s[i].day.slice(5))+'</text>'}).join("")+'</svg>';
}
var V={
 overview:async function(){
  var o=await api("overview"), s=o.series, td=s[s.length-1], T=td.stats||{};
  $("live").lastChild.textContent=o.online+" online"; $("sub").textContent=o.users+" users · "+o.guests+" guests";
  var feats=["chat","code","image","thumb","tools","video","aivideo"], fl={chat:"Chat",code:"Code",image:"Photos",thumb:"Thumbnails",tools:"Creator tools",video:"Videos",aivideo:"AI videos"};
  var fmax=Math.max.apply(null,feats.map(function(f){return Number(T[f]||0)}).concat([1]));
  var week=s.reduce(function(a,x){return a+Number(x.stats.total||0)},0);
  var h='<div class="cards">'+[["Online now",o.online],["Users",o.users],["Guests",o.guests],["Active today",td.active],["Requests today",T.total||0],["Saved chats",o.chats]].map(function(x){return '<div class="stat"><div class="mu">'+x[0]+'</div><div class="big">'+esc(x[1])+'</div></div>'}).join("")+'</div>';
  h+='<div class="card"><h3>Requests, last 7 days</h3><div class="mu" style="margin-bottom:8px">'+week+' in total</div>'+chart(s)+'</div>';
  h+='<div class="card"><h3>What people used today</h3>'+feats.map(function(f){var v=Number(T[f]||0);return '<div class="row" style="padding:9px 0"><div class="m"><b>'+fl[f]+'</b></div><div class="meter"><div style="width:'+Math.round(v/fmax*100)+'%"></div></div><b style="width:34px;text-align:right;flex:none">'+v+'</b></div>'}).join("")+'</div>';
  var a=await api("getannounce");
  h+='<div class="card"><h3>Announcement banner</h3><p class="mu">Shown at the top of the app for everyone. Leave empty to remove it.</p><input id="ann" maxlength="240" placeholder="Example: New thumbnail maker is live!" value="'+esc(a.text)+'"><button class="btn" id="annb" style="margin-top:10px">Save announcement</button></div>';
  $("view").innerHTML=h;
  $("annb").onclick=async function(){ try{ await api("announce",{text:$("ann").value}); $("annb").textContent="Saved"; setTimeout(function(){ $("annb").textContent="Save announcement"; },1500); }catch(e){ alert(e.message); } };
 },

 premium:async function(){
  var d=await Promise.all([api("premlist"),api("refs"),api("getcfg")]), pl=d[0].premium, rf=d[1].refs, pr=d[2].cfg.premium;
  var h='<div class="card"><h3>Give Premium</h3><p class="mu">Use this after someone pays you. They need an Omnia account.</p><label>Email of the user</label><input id="pg-e" placeholder="name@email.com" inputmode="email"><label>Days</label><select id="pg-d"><option value="1">1 day</option><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">365 days</option></select><div class="err" id="pg-err"></div><button class="btn" id="pg-go" style="margin-top:8px">Give Premium</button></div>';
  h+='<div class="card"><h3>Premium members ('+pl.filter(function(x){return x.active}).length+' active)</h3>'+(pl.length?pl.map(function(x){ return '<div class="row"><div class="av">'+ini(x.name)+'</div><div class="m"><b>'+esc(x.name)+' <span class="tag '+(x.active?"ok":"warn")+'">'+(x.active?"active":"ended")+'</span></b><small class="mu">'+esc(x.email)+' · until '+esc(dt(x.until))+'</small></div><button class="btn r sm" data-r="'+esc(x.email)+'">End</button></div>'; }).join(""):'<div class="empty">No premium members yet.</div>')+'</div>';
  h+='<div class="card"><h3>Top inviters</h3><p class="mu">Invites count when a new person joins from a link.</p>'+(rf.length?rf.map(function(x){ return '<div class="row"><div class="av">'+ini(x.name)+'</div><div class="m"><b>'+esc(x.name)+'</b><small class="mu">'+esc(x.email)+'</small></div><div style="text-align:right"><b>'+x.invites+'</b><small class="mu">'+x.days+' free days</small></div></div>'; }).join(""):'<div class="empty">No invites yet.</div>')+'</div>';
  h+='<div class="card"><h3>Premium page settings</h3><label>Payment link (https://)</label><input id="ps-u" value="'+esc(pr.payUrl)+'" placeholder="https://rzp.io/l/yourlink" inputmode="url"><label>Price text</label><input id="ps-p" maxlength="60" value="'+esc(pr.price)+'" placeholder="Rs 99 for 30 days"><label>Note shown to users</label><input id="ps-n" maxlength="160" value="'+esc(pr.note)+'" placeholder="After paying, send the receipt on Discord"><label>Invites needed for a reward</label><input id="ps-i" type="number" min="1" value="'+pr.inviteNeed+'"><label>Premium days per reward</label><input id="ps-d" type="number" min="1" value="'+pr.inviteDays+'"><label>Most free days from invites (per person)</label><input id="ps-c" type="number" min="0" value="'+pr.inviteCapDays+'"><div class="err" id="ps-err"></div><button class="btn" id="ps-go" style="margin-top:8px">Save settings</button></div>';
  $("view").innerHTML=h;
  $("pg-go").onclick=async function(){ $("pg-err").textContent=""; try{ var r=await api("premgrant",{id:$("pg-e").value.trim(),days:Number($("pg-d").value)}); alert("Done. Premium until "+dt(r.until)); show("premium"); }catch(e){ $("pg-err").textContent=e.message; } };
  [].forEach.call($("view").querySelectorAll("[data-r]"),function(b){ b.onclick=async function(){ if(!confirm("End Premium for this person?")) return; await api("premrevoke",{id:b.dataset.r}); show("premium"); }; });
  $("ps-go").onclick=async function(){ $("ps-err").textContent=""; try{ await api("setcfg",{cfg:{premium:{payUrl:$("ps-u").value.trim(),price:$("ps-p").value,note:$("ps-n").value,inviteNeed:Number($("ps-i").value),inviteDays:Number($("ps-d").value),inviteCapDays:Number($("ps-c").value)}}}); $("ps-go").textContent="Saved"; setTimeout(function(){ $("ps-go").textContent="Save settings"; },1500); }catch(e){ $("ps-err").textContent=e.message; } };
 },
 controls:async function(){
  var d=await api("getcfg"), c=d.cfg, F=d.features;
  var nm={chat:"Chat",code:"Code builds",image:"Photos",thumb:"Thumbnails",video:"Video plans",vidimg:"Video scene photos",tools:"Creator tools",song:"Songs",aux:"Helpers"};

    $("c-del").onclick=async function(){ if(!confirm("Delete all saved chats of this person?")) return; await api("delchat",{id:c.id}); closeSheet(); if(TAB==="chats") show("chats"); };
  }catch(e){ openSheet('<div class="card"><b>Could not load</b><p class="mu">'+esc(e.message)+'</p></div>'); }
}
function adForm(a){
  a=a||{on:true,who:"all",cta:"Learn more"};
  openSheet('<h3 style="margin:0 0 4px">'+(a.id?"Edit ad":"New ad")+'</h3><p class="mu">Shown with an "Ad" label. People can hide it.</p><label>Title</label><input id="f-t" maxlength="60" value="'+esc(a.title||"")+'" placeholder="Learn Python in 30 days"><label>Short text (optional)</label><input id="f-x" maxlength="140" value="'+esc(a.text||"")+'" placeholder="Free course for beginners"><label>Button text</label><input id="f-c" maxlength="20" value="'+esc(a.cta||"")+'" placeholder="Learn more"><label>Link (https://)</label><input id="f-u" value="'+esc(a.url||"")+'" placeholder="https://your-link.com" inputmode="url"><label>Picture link (optional, https://)</label><input id="f-i" value="'+esc(a.img||"")+'" placeholder="https://.../picture.png" inputmode="url"><label>Show to</label><select id="f-w"><option value="all"'+(a.who!=="guests"?" selected":"")+'>Everyone</option><option value="guests"'+(a.who==="guests"?" selected":"")+'>Guests only</option></select><label>Start date (optional)</label><input id="f-s1" type="date" value="'+(a.start?new Date(a.start).toISOString().slice(0,10):"")+'"><label>End date (optional)</label><input id="f-s2" type="date" value="'+(a.end?new Date(a.end).toISOString().slice(0,10):"")+'"><label>Stop after this many views (0 = no limit)</label><input id="f-mv" type="number" min="0" value="'+(a.maxViews||0)+'"><div class="sw"><input type="checkbox" id="f-o"'+(a.on!==false?" checked":"")+'><span>Live (turn off to pause)</span></div><label>Preview</label><div class="adprev" id="f-p"></div><div class="err" id="f-e"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="f-s" style="flex:1">Save ad</button><button class="btn g" id="f-c2">Cancel</button></div>');
  function prev(){ var img=$("f-i").value.trim(); $("f-p").innerHTML='<span class="lab">AD</span>'+(/^https:\/\//.test(img)?'<img alt="" src="'+esc(img)+'">':'')+'<div class="at"><b>'+esc($("f-t").value||"Your title")+'</b><p>'+esc($("f-x").value)+'</p></div><button class="go">'+esc($("f-c").value||"Learn more")+'</button>'; }
  ["f-t","f-x","f-c","f-i"].forEach(function(i){ $(i).oninput=prev; }); prev();
  $("f-c2").onclick=closeSheet;
  $("f-s").onclick=async function(){
    $("f-e").textContent="";
    try{ await api("adsave",{ad:{id:a.id,title:$("f-t").value,text:$("f-x").value,cta:$("f-c").value,url:$("f-u").value.trim(),img:$("f-i").value.trim(),who:$("f-w").value,on:$("f-o").checked,startDay:$("f-s1").value,endDay:$("f-s2").value,maxViews:Number($("f-mv").value)||0}}); closeSheet(); show("ads"); }
    catch(e){ $("f-e").textContent=e.message; }
  };
}
